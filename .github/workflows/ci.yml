name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format, vet, test and build
        run: |
          gofmt -w cmd internal
          go vet ./...
          go test -count=1 ./...
          go build -o storage-cli ./cmd/storage-cli
          ./storage-cli version
